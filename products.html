<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Our Products</h1>
    </header>

    <main class="product-container">
        <!-- Card 1 -->
        <article class="product-card">
            <img src="https://placeholder.com" alt="Product 1" class="product-image">
            <h2 class="product-name">Minimalist Watch</h2>
            <p class="product-price">$129.99</p>
            <button class="add-to-cart-btn">Add to Cart</button>
        </article>

        <!-- Card 2 -->
        <article class="product-card">
            <img src="https://placeholder.com" alt="Product 2" class="product-image">
            <h2 class="product-name">Wireless Headphones</h2>
            <p class="product-price">$89.99</p>
            <button class="add-to-cart-btn">Add to Cart</button>
        </article>

        <!-- Card 3 -->
        <article class="product-card">
            <img src="https://placeholder.com" alt="Product 3" class="product-image">
            <h2 class="product-name">Leather Backpack</h2>
            <p class="product-price">$149.99</p>
            <button class="add-to-cart-btn">Add to Cart</button>
        </article>

        <!-- Card 4 -->
        <article class="product-card">
            <img src="https://placeholder.com" alt="Product 4" class="product-image">
            <h2 class="product-name">Smart Water Bottle</h2>
            <p class="product-price">$39.99</p>
            <button class="add-to-cart-btn">Add to Cart</button>
        </article>

        <!-- Card 5 -->
        <article class="product-card">
            <img src="https://placeholder.com" alt="Product 5" class="product-image">
            <h2 class="product-name">Mechanical Keyboard</h2>
            <p class="product-price">$109.99</p>
            <button class="add-to-cart-btn">Add to Cart</button>
        </article>

        <!-- Card 6 -->
        <article class="product-card">
            <img src="https://placeholder.com" alt="Product 6" class="product-image">
            <h2 class="product-name">Ergonomic Mouse</h2>
            <p class="product-price">$59.99</p>
            <button class="add-to-cart-btn">Add to Cart</button>
        </article>
    </main>

</body>
</html>
